<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TAKO-SEN 実績アイコン一覧</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        padding: 24px 12px;
        max-width: 1000px;
        background: #fff7ec;
        color: #2a1b14;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 22px;
      }
      p {
        line-height: 1.7;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      figure {
        margin: 0;
        padding: 12px;
        background: #fffdf8;
        border: 1px solid #e5d5c3;
        border-radius: 14px;
      }
      .pair {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .tile {
        width: 64px;
        height: 64px;
        background: #fff0c7;
        border-radius: 12px;
      }
      img {
        display: block;
        width: 64px;
        height: 64px;
      }
      .silhouette {
        filter: brightness(0);
        opacity: 0.25;
      }
      figcaption {
        margin-top: 10px;
        font-size: 13px;
      }
      code {
        display: block;
        overflow-wrap: anywhere;
        font-size: 11px;
        margin-top: 4px;
      }
      .legend {
        display: flex;
        justify-content: space-around;
        font-size: 11px;
        color: #5f4636;
        margin-top: 4px;
      }
    </style>
  </head>
